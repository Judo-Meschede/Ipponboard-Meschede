name: USB synchronisation tests
on:
  push:
    branches: [main]
    paths:
      - 'server/usb-sync-*.js'
      - 'server/test-usb-sync-*.js'
      - 'server/server.js'
      - 'server/usb-export.js'
      - 'server/public/verwaltung.js'
      - '.github/workflows/usb-sync-tests.yml'
  workflow_dispatch:
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: JavaScript syntax
        run: |
          node --check server/server.js
          node --check server/usb-export.js
          node --check server/usb-sync-core.js
          node --check server/usb-sync-service.js
          node --check server/public/verwaltung.js
      - name: Masterdata sync unit tests
        run: node --test server/test-usb-sync-core.js server/test-usb-sync-service.js
