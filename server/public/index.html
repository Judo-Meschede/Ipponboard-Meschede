<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ipponboard Team</title><link rel="stylesheet" href="/style.css"></head>
<body class="operator">
  <main class="main-team">
    <div class="tabrail"><div class="tab">Liste</div><div class="tab active">Board</div></div>
    <section class="boardtab">
      <div class="boardhost"><div id="board" class="scoreview primary"></div></div>
      <div class="separator"></div>
      <div class="team-controls">
        <button id="resultsBtn">Ergebnisse anzeigen</button>
        <div class="roundfight"><div><span>Runde</span><img id="roundIcon" src="/assets/original/one_blue.png"></div><div><span>Kampf</span><b id="fightNo">1 / 7</b></div><div class="nav"><button data-act="prev-fight">◀ Vorheriger</button><button data-act="next-fight">Nächster ▶</button></div></div>
        <label class="golden"><input id="golden" type="checkbox"> Golden Score</label>
        <button id="resetBtn">Zurücksetzen</button>
      </div>
    </section>
  </main>
<script src="/app.js"></script></body></html>
